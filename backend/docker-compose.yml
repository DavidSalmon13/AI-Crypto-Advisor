services:
  postgres:
    image: postgres:16
    container_name: aicryptoadvisor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aicryptoadvisor
      POSTGRES_USER: aicryptoadvisor
      POSTGRES_PASSWORD: aicryptoadvisor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicryptoadvisor -d aicryptoadvisor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

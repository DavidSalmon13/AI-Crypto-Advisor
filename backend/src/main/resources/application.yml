spring:
  application:
    name: aicryptoadvisor
  datasource:
    url: ${DATABASE_URL}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
  frontend-origin: ${FRONTEND_ORIGIN}
  # Outbound integrations. API keys default to empty so the app still boots (and tests
  # still run) without secrets — each client degrades to its documented fallback instead.
  coingecko:
    base-url: https://api.coingecko.com/api/v3
    timeout-seconds: 5
  news:
    timeout-seconds: 5
  openrouter:
    base-url: https://openrouter.ai/api/v1
    api-key: ${OPENROUTER_API_KEY:}
    model: "${OPENROUTER_MODEL:poolside/laguna-xs-2.1:free}"
    timeout-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

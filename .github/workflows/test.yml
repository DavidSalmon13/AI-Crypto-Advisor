name: test

# Test-only. Deploys are triggered natively by Railway and Netlify on push to `main`
# (specs.md §9), so this workflow must never gain a deploy step.
on:
  push:
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (mvn test)
    runs-on: ubuntu-latest

    # The suite includes @SpringBootTest integration tests that run Flyway against a real
    # Postgres, so CI needs one. Credentials match backend/src/main/resources/
    # application-local.yml, which is the profile those tests activate.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aicryptoadvisor
          POSTGRES_USER: aicryptoadvisor
          POSTGRES_PASSWORD: aicryptoadvisor
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aicryptoadvisor -d aicryptoadvisor"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      # Not secrets: throwaway values that only need to satisfy startup validation.
      # JWT_SECRET just has to be >=32 bytes for HS256 key derivation. The real values
      # live in Railway's environment (specs.md §9.1) and never in this repo.
      JWT_SECRET: ci-only-test-secret-at-least-32-bytes-long
      FRONTEND_ORIGIN: http://localhost:5173

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn -B test
